:root {
  --ink: #2b1d3a;
  --cream: #fff7e6;
  --cream2: #f3dfba;
  --green: #6fd35a; --green2: #3f9a3a;
  --yellow: #ffd84a; --yellow2: #e09a1a;
  --red: #ff6070; --red2: #c43a4d;
  --blue: #5cbcf2; --blue2: #2f7fc0;
  --purple: #9a72e0; --purple2: #5f3fa6;
  --font: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1430; }
body {
  font-family: var(--font); font-weight: 800; color: var(--ink);
  background: radial-gradient(circle at 50% 40%, #3b2a5c 0%, #1d1430 70%);
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; border-radius: 6px; box-shadow: 0 10px 60px rgba(0,0,0,.5); background: #8fd36c; }
#cv { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
.hidden { display: none !important; }

/* ---------- icons ---------- */
.ico { display: inline-block; width: 32px; height: 32px; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* ---------- outlined text helper ---------- */
.ol { -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; color: #fff; }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--font); font-weight: 800; font-size: 22px; color: #fff; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 18px; padding: 8px 20px 10px;
  box-shadow: 0 5px 0 var(--ink), inset 0 -5px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.35);
  -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
  transition: transform .08s, box-shadow .08s, filter .12s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; position: relative;
}
.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.14); }
.btn.green { background: linear-gradient(#8ae672, var(--green) 55%, #5cc248); }
.btn.yellow { background: linear-gradient(#ffe57d, var(--yellow) 55%, #f5c636); }
.btn.red { background: linear-gradient(#ff8a96, var(--red) 55%, #f04a5c); }
.btn.blue { background: linear-gradient(#86d2fa, var(--blue) 55%, #46a8e6); }
.btn.purple { background: linear-gradient(#b796f0, var(--purple) 55%, #8460cf); }
.btn.cream { background: linear-gradient(#fffdf6, var(--cream) 55%, #f5e6c8); color: var(--ink); -webkit-text-stroke: 0; }
.btn.round { width: 54px; height: 54px; padding: 0; border-radius: 50%; }
.btn.round .ico { width: 30px; height: 30px; }
.btn.big { font-size: 40px; padding: 10px 56px 16px; border-radius: 26px; box-shadow: 0 8px 0 var(--ink), inset 0 -7px 0 rgba(0,0,0,.14), inset 0 4px 0 rgba(255,255,255,.4); }
.btn.big:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.btn.wide { width: 100%; margin-top: 12px; }
.btn.disabled, .btn:disabled { filter: grayscale(.85) brightness(.92); cursor: not-allowed; }
.btn.disabled:active, .btn:disabled:active { transform: none; box-shadow: 0 5px 0 var(--ink); }
.btn.toggle.off { filter: grayscale(1) opacity(.7); }
.btn.toggle.off::after { content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 4px; background: var(--red); border: 2px solid var(--ink); border-radius: 4px; transform: rotate(-40deg); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-tl { position: absolute; left: 14px; top: 12px; display: flex; gap: 10px; pointer-events: none; }
.pill {
  pointer-events: auto; display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 18px 0 6px;
  background: linear-gradient(#fffdf6, var(--cream) 60%, #f3e2c3); border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink), inset 0 -4px 0 rgba(0,0,0,.08); font-size: 24px; min-width: 96px;
}
.pill .ico { width: 36px; height: 36px; margin-top: -2px; }
.pill b { font-variant-numeric: tabular-nums; transition: transform .15s; display: inline-block; }
.pill b.bump { transform: scale(1.3); color: #e08a00; }
.pill.hurt { animation: hurt .4s; }
.pill.wave { padding-left: 16px; }
.pill.wave .lbl { font-size: 15px; color: #7a6390; margin-right: 2px; }
@keyframes hurt { 0%,100% { transform: none; } 20% { transform: translateX(-6px) rotate(-3deg); background: #ffd0d6; } 60% { transform: translateX(5px) rotate(2deg); } }
.hud-tr { position: absolute; right: 14px; top: 10px; display: flex; gap: 10px; pointer-events: none; }
.hud-tr .btn { pointer-events: auto; }
#btnSpeed { width: 74px; border-radius: 28px; gap: 0; }
#btnSpeed em { font-style: normal; font-size: 16px; margin-left: -2px; }
#btnSpeed.on { background: linear-gradient(#ffe57d, var(--yellow) 55%, #f5c636); }

/* shop */
#shop {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px 10px 10px;
  background: linear-gradient(rgba(255,247,230,.96), rgba(243,223,186,.96)); border: 3px solid var(--ink); border-radius: 22px;
  box-shadow: 0 5px 0 var(--ink), inset 0 -5px 0 rgba(0,0,0,.08);
}
.card {
  position: relative; width: 92px; height: 106px; border: 3px solid var(--ink); border-radius: 16px; cursor: pointer;
  background: radial-gradient(circle at 50% 30%, #ffffff 0%, #fdf0d4 70%); box-shadow: 0 4px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: transform .1s, box-shadow .1s, filter .15s; overflow: hidden;
}
.card canvas { position: absolute; left: 50%; top: 1px; width: 80px; height: 80px; transform: translateX(-50%); pointer-events: none; }
.card .cost { position: relative; z-index: 1; display: flex; align-items: center; gap: 2px; font-size: 18px; background: var(--ink); color: var(--yellow); width: 100%; justify-content: center; padding: 1px 0 3px; }
.card .cost .ico { width: 18px; height: 18px; }
.card .key { position: absolute; left: 4px; top: 3px; font-size: 13px; width: 20px; height: 20px; line-height: 17px; text-align: center; background: var(--ink); color: #fff; border-radius: 7px; }
.card:hover { transform: translateY(-5px); box-shadow: 0 9px 0 var(--ink); }
.card.sel { transform: translateY(-8px); box-shadow: 0 12px 0 var(--ink), 0 0 0 4px var(--yellow), 0 0 22px 6px rgba(255,216,74,.8); }
.card.poor { filter: grayscale(.9) brightness(.85); }
.card.poor .cost { color: #ff8a96; }
.card.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

/* next wave button */
#btnWave {
  position: absolute; right: 18px; bottom: 30px; width: 112px; height: 112px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: none;
  font-family: var(--font); font-weight: 800;
}
#btnWave .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
#btnWave .ring .bg { fill: #ffe57d; stroke: var(--ink); stroke-width: 6; }
#btnWave .ring .fg { fill: none; stroke: #ff8a3d; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 276.5; stroke-dashoffset: 276.5; transition: stroke-dashoffset .2s linear; }
#btnWave .face { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); width: 64px; height: 64px; }
#btnWave .face canvas { width: 64px; height: 64px; }
#btnWave .lbl { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); white-space: nowrap; font-size: 17px; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
#btnWave .bonus { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); white-space: nowrap; font-size: 16px; color: var(--yellow); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
#btnWave:hover { transform: scale(1.05); }
#btnWave:active { transform: scale(.96); }
#btnWave.ready { animation: pulse 1.1s infinite; }
#btnWave.off { opacity: 0; pointer-events: none; transform: scale(.6); transition: opacity .25s, transform .25s; }
#btnWave { transition: opacity .25s, transform .2s; }
@keyframes pulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255,216,74,0)); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(255,216,74,.95)); } }

/* tower panel */
#towerPanel {
  position: absolute; width: 300px; padding: 12px 14px 14px; background: linear-gradient(#fffdf6, var(--cream) 60%, #f6e5c5);
  border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink), 0 12px 30px rgba(43,29,58,.35);
  animation: pop .18s ease-out; z-index: 5;
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.tp-head { display: flex; align-items: center; gap: 8px; }
.tp-head canvas { width: 56px; height: 56px; margin: -8px -4px -6px -8px; }
.tp-name { font-size: 21px; line-height: 1.1; }
.tp-lv { font-size: 13px; color: #8a7398; display: flex; gap: 3px; margin-top: 2px; align-items: center; }
.tp-lv i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); background: #e8dccc; display: inline-block; }
.tp-lv i.on { background: var(--yellow); }
.tp-close { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font-size: 18px; line-height: 1; cursor: pointer; font-family: var(--font); font-weight: 800; color: var(--ink); box-shadow: 0 3px 0 var(--ink); align-self: flex-start; }
.tp-stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 15px; margin: 10px 0 8px; padding: 8px 10px; background: rgba(43,29,58,.06); border-radius: 12px; }
.tp-stats dt { color: #7a6390; font-weight: 500; }
.tp-stats dd { margin: 0; }
.tp-stats dd .up { color: #2f9a2a; }
.tp-target { display: flex; gap: 4px; margin-bottom: 10px; }
.tp-target button { flex: 1; font-family: var(--font); font-weight: 800; font-size: 13px; padding: 5px 0; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); cursor: pointer; }
.tp-target button.on { background: var(--blue); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.tp-target-lbl { font-size: 12px; color: #7a6390; margin-bottom: 3px; font-weight: 500; }
.tp-up { width: 100%; display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 8px 12px 10px; gap: 0; }
.tp-up .t { font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
.tp-up .d { font-size: 13px; -webkit-text-stroke: 3px var(--ink); font-weight: 800; opacity: .95; }
.tp-up .c { display: flex; align-items: center; gap: 2px; font-size: 19px; color: var(--yellow); }
.tp-up .c .ico { width: 20px; height: 20px; }
.tp-branches { display: flex; gap: 8px; }
.tp-branch { flex: 1; flex-direction: column; padding: 6px 6px 8px; gap: 2px; border-radius: 16px; }
.tp-branch canvas { width: 64px; height: 64px; margin: -6px 0 -4px; }
.tp-branch .t { font-size: 15px; white-space: nowrap; }
.tp-branch .d { font-size: 11px; -webkit-text-stroke: 3px var(--ink); line-height: 1.3; text-align: center; min-height: 42px; }
.tp-branch .c { font-size: 17px; color: var(--yellow); display: flex; align-items: center; gap: 2px; }
.tp-branch .c .ico { width: 18px; height: 18px; }
.tp-max { text-align: center; font-size: 17px; padding: 8px; color: #b07a00; background: rgba(255,216,74,.25); border-radius: 12px; border: 2px dashed #e0b23a; }
.tp-sell { margin-top: 10px; width: 100%; font-size: 17px; padding: 6px 12px 8px; }
.tp-sell .ico { width: 20px; height: 20px; }

/* tooltip */
#tooltip { position: absolute; width: 270px; padding: 10px 14px 12px; background: var(--ink); color: #fff; border-radius: 14px; font-size: 14px; pointer-events: none; z-index: 6; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
#tooltip h3 { margin: 0 0 4px; font-size: 19px; color: var(--yellow); }
#tooltip p { margin: 0 0 6px; font-weight: 500; line-height: 1.45; }
#tooltip .tags { display: flex; flex-wrap: wrap; gap: 4px; }
#tooltip .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: #4b3a63; }
#tooltip .tag.good { background: #2f7a3a; } #tooltip .tag.bad { background: #8a2f42; }
#tooltip::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: var(--ink); }

/* banner */
#banner { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); text-align: center; pointer-events: none !important; opacity: 0; }
#banner.show { animation: banner 2.6s ease-out forwards; }
#banner .ribbon { position: relative; display: inline-block; padding: 6px 54px 12px; background: linear-gradient(#ff8a96, #f04a5c); border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 var(--ink); }
#banner.boss .ribbon { background: linear-gradient(#b796f0, #6a3fb8); }
#banner .ribbon::before, #banner .ribbon::after { content: ''; position: absolute; top: 14px; width: 40px; height: 100%; background: #c43a4d; border: 4px solid var(--ink); z-index: -1; }
#banner.boss .ribbon::before, #banner.boss .ribbon::after { background: #4b2783; }
#banner .ribbon::before { left: -30px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 30% 50%); }
#banner .ribbon::after { right: -30px; clip-path: polygon(0 0, 100% 0, 70% 50%, 100% 100%, 0 100%); }
#banner .t { font-size: 46px; color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; letter-spacing: 2px; white-space: nowrap; }
#banner .s { margin-top: 12px; font-size: 20px; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
@keyframes banner {
  0% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(.7); }
  12% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.08); }
  20% { transform: translateX(-50%) scale(1); }
  80% { opacity: 1; transform: translateX(-50%) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(.95); }
}

/* boss bar */
#bossbar { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: 400px; text-align: center; pointer-events: none !important; }
#bossbar .name { font-size: 18px; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; margin-bottom: 2px; }
#bossbar .bar { height: 22px; border: 3px solid var(--ink); border-radius: 12px; background: #3b2a4c; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
#bossbar .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff8a96, #e03a50); transition: width .2s; box-shadow: inset 0 4px 0 rgba(255,255,255,.35); }

/* enemy intro */
#intro { position: absolute; right: 16px; top: 76px; width: 300px; padding: 10px 12px 12px; display: flex; gap: 10px; align-items: center; background: linear-gradient(#fffdf6, var(--cream)); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; animation: slidein .35s ease-out; }
#intro canvas { width: 72px; height: 72px; flex: none; background: radial-gradient(circle, #f1e6ff, #dccbf5); border-radius: 14px; border: 2.5px solid var(--ink); }
#intro .new { position: absolute; left: -10px; top: -12px; background: var(--red); color: #fff; font-size: 14px; padding: 2px 10px 4px; border: 3px solid var(--ink); border-radius: 10px; transform: rotate(-8deg); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
#intro h4 { margin: 0 0 2px; font-size: 18px; }
#intro p { margin: 0; font-size: 13px; font-weight: 500; line-height: 1.45; }
@keyframes slidein { from { transform: translateX(120%); } to { transform: none; } }

/* hint */
#hint { position: absolute; padding: 10px 16px 12px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); font-size: 17px; pointer-events: none !important; animation: bob 1.4s ease-in-out infinite; white-space: nowrap; }
#hint::after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -14px; margin-left: -12px; border: 12px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
@keyframes bob { 50% { transform: translateY(-6px); } }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; }
.title-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(43,29,58,.05) 0%, rgba(43,29,58,.45) 100%); }
.logo { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 760px; height: 300px; animation: float 4s ease-in-out infinite; }
.logo svg { width: 100%; height: 100%; overflow: visible; }
@keyframes float { 50% { transform: translateX(-50%) translateY(-10px) rotate(-.6deg); } }
.title-buttons { position: absolute; left: 0; right: 0; top: 430px; text-align: center; }
#btnPlay { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.06); } }
.title-toggles { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 10px; }
.credit { position: absolute; left: 18px; bottom: 16px; font-size: 13px; color: #fff; font-weight: 500; text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); opacity: .9; }

.levels-bg { position: absolute; inset: 0; background: rgba(43,29,58,.55); backdrop-filter: blur(3px); }
.heading { position: absolute; left: 0; right: 0; top: 34px; margin: 0; text-align: center; font-size: 46px; color: #fff; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; letter-spacing: 2px; }
.level-cards { position: absolute; left: 0; right: 0; top: 130px; display: flex; justify-content: center; gap: 28px; }
.lcard { width: 360px; padding: 12px 12px 16px; background: linear-gradient(#fffdf6, var(--cream) 60%, #f3dfba); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 7px 0 var(--ink); position: relative; display: flex; flex-direction: column; align-items: center; transition: transform .15s; animation: cardin .45s backwards; }
.lcard:nth-child(2) { animation-delay: .08s; } .lcard:nth-child(3) { animation-delay: .16s; }
@keyframes cardin { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.lcard:hover { transform: translateY(-6px) rotate(-.5deg); }
.lcard .thumb { width: 336px; height: 189px; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; position: relative; }
.lcard .thumb canvas { width: 100%; height: 100%; display: block; }
.lcard .num { position: absolute; left: 8px; top: 8px; width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--ink); text-align: center; font-size: 22px; line-height: 34px; box-shadow: 0 3px 0 var(--ink); }
.lcard h3 { margin: 12px 0 0; font-size: 28px; }
.lcard .sub { font-size: 15px; color: #7a6390; font-weight: 500; }
.lcard .lstars { display: flex; gap: 6px; margin: 8px 0 10px; }
.lcard .lstars .ico { width: 40px; height: 40px; }
.lcard .meta { font-size: 14px; color: #7a6390; margin-bottom: 10px; font-weight: 500; }
.lcard .btn { min-width: 180px; }
.lcard.locked .thumb canvas { filter: grayscale(1) brightness(.6); }
.lcard .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; font-size: 18px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.lcard .lock .ico { width: 64px; height: 64px; }
.back { position: absolute; left: 22px; top: 30px; font-size: 18px; padding: 6px 16px 8px; }
.back .ico { width: 22px; height: 22px; }

.modal { background: rgba(43,29,58,.55); display: flex; align-items: center; justify-content: center; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.panel { width: 400px; padding: 22px 28px 26px; background: linear-gradient(#fffdf6, var(--cream) 60%, #f3dfba); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink), 0 20px 50px rgba(0,0,0,.4); text-align: center; animation: pop .25s ease-out; }
.panel h2 { margin: 0 0 6px; font-size: 40px; color: #fff; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
.panel .row { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
.panel .keys { margin-top: 16px; font-size: 12px; color: #7a6390; font-weight: 500; line-height: 1.6; }
.panel.result { width: 620px; }
.stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 10px; height: 110px; align-items: flex-end; }
.stars .ico { width: 90px; height: 90px; opacity: 0; transform: scale(.2); }
.stars .ico:nth-child(2) { width: 110px; height: 110px; }
.stars .ico.in { animation: starin .45s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes starin { from { opacity: 0; transform: scale(.2) rotate(-40deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
.res-stats { display: flex; justify-content: center; gap: 14px; font-size: 17px; }
.res-stats div { background: rgba(43,29,58,.07); border-radius: 14px; padding: 6px 16px; }
.res-stats small { display: block; font-size: 12px; color: #7a6390; font-weight: 500; }
.panel.result .btn { min-width: 160px; white-space: nowrap; }

#fade { position: absolute; inset: 0; background: #1d1430; pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 50; }
#fade.on { opacity: 1; pointer-events: auto; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- in-game HUD -->
  <div id="hud" class="hidden">
    <div class="hud-tl">
      <div class="pill" id="pLives" title="ライフ"><span class="ico" data-icon="heart"></span><b id="lives">20</b></div>
      <div class="pill" id="pGold" title="ゴールド"><span class="ico" data-icon="coin"></span><b id="gold">0</b></div>
      <div class="pill wave" id="pWave"><span class="lbl">ウェーブ</span><b id="wave">0/10</b></div>
    </div>
    <div class="hud-tr">
      <button class="btn round cream" id="btnSpeed" title="スピード切り替え (F)"><span class="ico" data-icon="fast"></span><em id="speedLbl">x1</em></button>
      <button class="btn round cream" id="btnPause" title="ポーズ (P)"><span class="ico" data-icon="pause"></span></button>
    </div>
    <div id="bossbar" class="hidden"><div class="name">グルームキング</div><div class="bar"><i id="bossFill"></i></div></div>
    <div id="shop"></div>
    <button id="btnWave" title="次のウェーブ (Space)">
      <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle id="waveRing" class="fg" cx="50" cy="50" r="44"/></svg>
      <span class="face" id="waveFace"></span>
      <span class="lbl" id="waveLbl">ウェーブ開始</span>
      <span class="bonus" id="waveBonus"></span>
    </button>
    <div id="towerPanel" class="hidden"></div>
    <div id="tooltip" class="hidden"></div>
    <div id="banner"><div class="ribbon"><div class="t" id="bannerT"></div></div><div class="s" id="bannerS"></div></div>
    <div id="intro" class="hidden"></div>
    <div id="hint" class="hidden"></div>
  </div>

  <!-- title -->
  <div id="title" class="screen">
    <div class="title-shade"></div>
    <div class="logo" id="logo"></div>
    <div class="title-buttons">
      <button class="btn big green" id="btnPlay">あそぶ</button>
    </div>
    <div class="title-toggles">
      <button class="btn round cream toggle" id="tSfx" title="効果音"><span class="ico" data-icon="sound"></span></button>
      <button class="btn round cream toggle" id="tMusic" title="音楽"><span class="ico" data-icon="music"></span></button>
      <button class="btn round cream" id="tFull" title="フルスクリーン"><span class="ico" data-icon="full"></span></button>
    </div>
    <div class="credit">フォント: M PLUS Rounded 1c (SIL OFL 1.1) ／ グラフィック・サウンドはすべてプログラムで生成</div>
  </div>

  <!-- level select -->
  <div id="levels" class="screen hidden">
    <div class="levels-bg"></div>
    <h1 class="heading">ステージをえらぼう</h1>
    <div class="level-cards" id="levelCards"></div>
    <button class="btn cream back" id="btnBack"><span class="ico" data-icon="back"></span>タイトルへ</button>
  </div>

  <!-- pause -->
  <div id="pause" class="screen modal hidden">
    <div class="panel">
      <h2>ポーズ中</h2>
      <button class="btn green wide" id="btnResume">つづける</button>
      <button class="btn yellow wide" id="btnRestart">さいしょから</button>
      <button class="btn cream wide" id="btnQuit">ステージ選択へ</button>
      <div class="row">
        <button class="btn round cream toggle" id="pSfx" title="効果音"><span class="ico" data-icon="sound"></span></button>
        <button class="btn round cream toggle" id="pMusic" title="音楽"><span class="ico" data-icon="music"></span></button>
        <button class="btn round cream" id="pFull" title="フルスクリーン"><span class="ico" data-icon="full"></span></button>
      </div>
      <div class="keys">操作: 1〜5 タワー選択 ／ Space 次のウェーブ ／ F スピード ／ U 強化 ／ Esc キャンセル</div>
    </div>
  </div>

  <!-- result -->
  <div id="result" class="screen modal hidden">
    <div class="panel result">
      <h2 id="resTitle">ステージクリア！</h2>
      <div class="stars" id="resStars"></div>
      <div class="res-stats" id="resStats"></div>
      <div class="row" id="resButtons"></div>
    </div>
  </div>

  <div id="fade"></div>
</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Small math / helper library shared by every module.
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const W = 1280, H = 720;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const Ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: (t) => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
  },
};

// Distance from point p to segment ab
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return dist(px, py, ax + dx * t, ay + dy * t);
}

// --- colour helpers --------------------------------------------------------
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function rgba(hex, a) { const c = hexToRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ---------------------------------------------------------------------------
// Path: Catmull-Rom smoothed polyline resampled at a uniform step so that
// position lookup by travelled distance is O(1).
// ---------------------------------------------------------------------------
class Path {
  constructor(ctrl, step = 2) {
    this.ctrl = ctrl;
    const dense = [];
    const P = ctrl;
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
      const segs = 24;
      for (let s = 0; s < segs; s++) {
        const t = s / segs, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    dense.push(P[P.length - 1].slice());
    // resample uniformly
    const out = [dense[0]];
    let carry = 0;
    for (let i = 1; i < dense.length; i++) {
      let [ax, ay] = dense[i - 1];
      const [bx, by] = dense[i];
      let seg = dist(ax, ay, bx, by);
      let d = step - carry;
      while (d <= seg) {
        const t = d / seg;
        out.push([lerp(ax, bx, t), lerp(ay, by, t)]);
        d += step;
      }
      carry = seg - (d - step);
    }
    out.push(dense[dense.length - 1]);
    this.pts = out;
    this.step = step;
    this.length = (out.length - 1) * step;
  }
  at(d, o) {
    o = o || {};
    const f = clamp(d / this.step, 0, this.pts.length - 1.001);
    const i = Math.floor(f), t = f - i;
    const a = this.pts[i], b = this.pts[i + 1];
    o.x = lerp(a[0], b[0], t); o.y = lerp(a[1], b[1], t);
    o.dx = b[0] - a[0]; o.dy = b[1] - a[1];
    return o;
  }
  distTo(x, y) {
    let best = 1e9;
    const p = this.pts;
    for (let i = 0; i < p.length - 1; i += 3) {
      const j = Math.min(i + 3, p.length - 1);
      const d = segDist(x, y, p[i][0], p[i][1], p[j][0], p[j][1]);
      if (d < best) best = d;
    }
    return best;
  }
  // first distance where path is inside the screen
  entryDist() {
    for (let i = 0; i < this.pts.length; i++) {
      const [x, y] = this.pts[i];
      if (x > 6 && x < W - 6 && y > 6 && y < H - 6) return i * this.step;
    }
    return 0;
  }
}

// safe localStorage
const Store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};

'use strict';
// ---------------------------------------------------------------------------
// Art: every sprite in the game is painted procedurally with the same rules
// (thick plum outline, two-tone cel shading lit from the top-left, glossy
// highlight, soft plum ground shadow) so the whole game shares one style.
// ---------------------------------------------------------------------------
const INK = '#2b1d3a';

const Art = {};

Art.cel = function (ctx, pathFn, base, dark, ox, oy, lw) {
  ctx.save();
  pathFn();
  ctx.fillStyle = dark; ctx.fill();
  ctx.clip();
  ctx.translate(ox, oy);
  pathFn();
  ctx.fillStyle = base; ctx.fill();
  ctx.restore();
  if (lw) {
    pathFn();
    ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  }
};

Art.ball = function (ctx, x, y, r, base, dark, lw = 2.5, gloss = 0.55) {
  Art.cel(ctx, () => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }, base, dark, -r * 0.2, -r * 0.24, lw);
  if (gloss) Art.gloss(ctx, x - r * 0.38, y - r * 0.42, r * 0.26, r * 0.15, -0.6, gloss);
};

Art.gloss = function (ctx, x, y, rx, ry, rot, a = 0.55) {
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill();
};

Art.shadow = function (ctx, x, y, rx, ry, a = 0.22) {
  ctx.fillStyle = `rgba(43,29,58,${a})`;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();
};

Art.ellipse = function (ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); };

// gumdrop silhouette, bottom centre at (0,0)
Art.gumdrop = function (ctx, w, h, lean = 0) {
  ctx.beginPath();
  ctx.moveTo(lean, -h);
  ctx.bezierCurveTo(lean + w * 0.85, -h, w, -h * 0.62, w, -h * 0.3);
  ctx.bezierCurveTo(w, -h * 0.02, w * 0.65, 0, 0, 0);
  ctx.bezierCurveTo(-w * 0.65, 0, -w, -h * 0.02, -w, -h * 0.3);
  ctx.bezierCurveTo(-w, -h * 0.62, lean - w * 0.85, -h, lean, -h);
  ctx.closePath();
};

Art.eyes = function (ctx, x, y, s, gap, blink, angry, look = 0.25) {
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    ctx.beginPath(); ctx.ellipse(ex, y, s * 0.8, s * (blink ? 0.14 : 1), 0, 0, TAU);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = Math.max(1.4, s * 0.32); ctx.strokeStyle = INK; ctx.stroke();
    if (!blink) {
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + s * look, y + s * 0.12, s * 0.48, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + s * (look + 0.14), y - s * 0.12, s * 0.17, 0, TAU); ctx.fill();
    }
  }
  if (angry) {
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, s * 0.45); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - gap - s * 0.8, y - s * 1.35); ctx.lineTo(x - gap + s * 0.7, y - s * 0.85);
    ctx.moveTo(x + gap + s * 0.8, y - s * 1.35); ctx.lineTo(x + gap - s * 0.7, y - s * 0.85);
    ctx.stroke();
  }
};

Art.star = function (ctx, x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
};

  gloomlet: { a: '#9468dc', b: '#6342ad', c: '#ffb3d1' },
  zipper: { a: '#ff69a8', b: '#cc3b7d', c: '#ffd1e4' },
  shell: { a: '#58a0e0', b: '#3767a8', c: '#c4bcb0', d: '#8d837a' },
  bubble: { a: '#c9b3ff', b: '#9b7fe6', c: '#9468dc', d: '#6342ad' },
  moth: { a: '#6a46a6', b: '#432870', c: '#ffa152', d: '#e0663a', e: '#ffe58a' },
  wisp: { a: '#a8f4ff', b: '#4fc4e8', c: '#effdff' },
  mender: { a: '#62d69c', b: '#35a06f', c: '#a9ec6c', d: '#ff8fb5' },
  brute: { a: '#7444bb', b: '#4b2783', c: '#f6e7c8', d: '#cdb894' },

const _palCache = new Map();
function enemyPal(type, state) {
  const key = type + state;
  let p = _palCache.get(key);
  if (p) return p;
  const src = ENEMY_PAL[type];
  p = {};
  for (const k in src) {
    if (state === 1) p[k] = mix(src[k], '#bdefff', 0.5);
    else if (state === 2) p[k] = mix(src[k], '#ffffff', 0.82);
    else p[k] = src[k];
  }
  _palCache.set(key, p);
  return p;
}

Art.enemy = {};
const ENEMY_FRAMES = { moth: 32 };
Art.enemySprite = function (type, st, fr, blink) {
  const r = ENEMIES[type].r;
  const hw = r * 2.6 + 12, top = r * 3.3 + 16;
  const F = ENEMY_FRAMES[type] || 16;
  const b = ENEMIES[type].fly ? [-hw, -top, hw, top * 0.6] : [-hw, -top, hw, 10];
  return Sprites.get(`e${type}${st}${fr}${blink ? 'b' : ''}`, b, (c) => Art.enemy[type](c, enemyPal(type, st), (fr / F) * TAU, 1, blink));
};

Art.enemy.gloomlet = function (ctx, p, ph, scale = 1, blink = false) {
  const hop = Math.abs(Math.sin(ph));
  const sq = Math.cos(ph * 2) * 0.07;
  const w = 13 * scale, h = 24 * scale;
  // feet
  ctx.fillStyle = p.b;
  for (const s of [-1, 1]) {
    Art.ellipse(ctx, s * 6 * scale + Math.sin(ph) * s * 2, -1, 4.5 * scale, 3 * scale);
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
  }
  ctx.save();
  ctx.translate(0, -hop * 3 * scale - 2);
  ctx.scale(1 + sq, 1 - sq);
  // tuft
  ctx.beginPath(); ctx.moveTo(-2 * scale, -h + 2); ctx.quadraticCurveTo(-6 * scale, -h - 9 * scale, 3 * scale, -h - 8 * scale);
  ctx.quadraticCurveTo(-1 * scale, -h - 4 * scale, 3 * scale, -h + 2); ctx.closePath();
  ctx.fillStyle = p.b; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
  Art.cel(ctx, () => Art.gumdrop(ctx, w, h), p.a, p.b, -3 * scale, -3 * scale, 2.5);
  Art.gloss(ctx, -w * 0.45, -h * 0.72, 3.4 * scale, 2 * scale, -0.6, 0.6);
  // blush + eyes + mouth
  ctx.fillStyle = rgba(p.c, 0.7);
  Art.ellipse(ctx, w * 0.62, -h * 0.36, 3 * scale, 1.8 * scale); ctx.fill();
  Art.eyes(ctx, w * 0.3, -h * 0.56, 3.6 * scale, 4.2 * scale, blink, false);
  ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(w * 0.32, -h * 0.34, 2.6 * scale, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
};

Art.enemy.zipper = function (ctx, p, ph, scale = 1, blink = false) {
  const w = 11 * scale, h = 19 * scale;
  const run = Math.sin(ph * 2);
  // speed streaks
  ctx.strokeStyle = rgba('#ffffff', 0.7); ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const y = -6 - i * 6, l = 8 + (((ph / TAU) * 12 + i * 2) % 6);
    ctx.beginPath(); ctx.moveTo(-w - 4, y); ctx.lineTo(-w - 4 - l, y); ctx.stroke();

Art.enemy.bubble = function (ctx, p, ph, scale = 1, blink = false) {

    const a = ph + i * TAU / 3;

    Art.ball(ctx, bx, by, 5.2 * scale, p.c, p.d, 1.6, 0);

Art.enemy.moth = function (ctx, p, ph, scale = 1, blink = false) {

Art.enemy.wisp = function (ctx, p, ph, scale = 1, blink = false) {
  const r = 13 * scale;
  ctx.save();
  ctx.translate(0, -r - 8 + Math.sin(ph) * 3);

    ctx.beginPath();

Art.enemy.brute = function (ctx, p, ph, scale = 1, blink = false) {

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(w * 0.15, -h * 0.315); ctx.lineTo(w * 0.22, -h * 0.25); ctx.lineTo(w * 0.29, -h * 0.29); ctx.fill();

Art.enemy.king = function (ctx, p, ph, scale = 1, blink = false) {
  const w = 40 * scale, h = 70 * scale;
  const step = Math.sin(ph);
  // cape behind
  const cape = () => {
    ctx.beginPath(); ctx.moveTo(-w * 0.2, -h * 0.85);
    ctx.bezierCurveTo(-w * 1.3, -h * 0.7, -w * 1.5 + step * 4, -h * 0.1, -w * 1.25 + step * 6, -2);
    ctx.lineTo(w * 0.2, -2); ctx.closePath();
  };
  Art.cel(ctx, cape, p.e, p.f, -3, -3, 3);
  ctx.fillStyle = p.b;
  for (const s of [-1, 1]) { Art.ellipse(ctx, s * 20 + step * s * 3, -1, 11, 6.5); ctx.fill(); ctx.lineWidth = 2.8; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.save();
  ctx.translate(0, -2 - Math.abs(step) * 2.5);
  Art.cel(ctx, () => Art.gumdrop(ctx, w, h), p.a, p.b, -7, -7, 3.4);
  Art.gloss(ctx, -w * 0.45, -h * 0.74, 9, 5, -0.6, 0.5);
  // fur collar
  ctx.fillStyle = '#fff6e8'; ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) {
    const x = -w * 0.95 + (i / 8) * w * 1.9;
    const y = -h * 0.3 + Math.sin((i / 8) * Math.PI) * h * 0.06;
    ctx.arc(x, y, 6.5, 0, TAU);
  }
  ctx.fill();
  for (let i = 0; i <= 8; i++) {
    const x = -w * 0.95 + (i / 8) * w * 1.9;
    const y = -h * 0.3 + Math.sin((i / 8) * Math.PI) * h * 0.06;
    ctx.beginPath(); ctx.arc(x, y, 6.5, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  }
  Art.eyes(ctx, w * 0.25, -h * 0.6, 7, 9, blink, true);
  // moustache
  ctx.fillStyle = INK;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(w * 0.25, -h * 0.45);
    ctx.quadraticCurveTo(w * 0.25 + s * 14, -h * 0.48, w * 0.25 + s * 20, -h * 0.4);
    ctx.quadraticCurveTo(w * 0.25 + s * 12, -h * 0.42, w * 0.25, -h * 0.41); ctx.fill();
  }
  // crown
  ctx.save(); ctx.translate(w * 0.05, -h * 0.98 + Math.sin(ph * 2) * 1.5); ctx.rotate(0.08);

    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-23, -22); ctx.lineTo(-11, -11); ctx.lineTo(0, -27); ctx.lineTo(11, -11); ctx.lineTo(23, -22); ctx.lineTo(20, 0); ctx.closePath();
  };
  Art.cel(ctx, crown, p.c, p.d, -2, -2, 2.6);
  for (const [x, y, c] of [[0, -8, '#5ad1ff'], [-12, -5, '#ff5a7a'], [12, -5, '#7cf06b']]) {
    ctx.fillStyle = c; Art.ellipse(ctx, x, y, 3.2, 3.2); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
};

// Towers
// ---------------------------------------------------------------------------
const PLAT = [
  { side: '#9a6235', top: '#c98a4b', line: '#a8703f' },
  { side: '#8f8780', top: '#c9c2b9', line: '#a39b93' },
  { side: '#8f8780', top: '#d6cfc6', line: '#a39b93', trim: '#ffcc3d' },
  { side: '#7d6fa0', top: '#e8e2f2', line: '#b9aed0', trim: '#ffcc3d' },
];
Art.platform = function (ctx, lvl, flag) {
  const P = PLAT[Math.min(lvl, 4) - 1];
  const rx = 27, ry = 12.5, th = 7;
  const sil = () => {
    ctx.beginPath(); ctx.moveTo(-rx, -th); ctx.lineTo(-rx, 0);
    ctx.ellipse(0, 0, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(rx, -th); ctx.ellipse(0, -th, rx, ry, 0, 0, Math.PI, true); ctx.closePath();
  };
  sil(); ctx.fillStyle = P.side; ctx.fill();
  if (P.trim) {
    ctx.save(); sil(); ctx.clip();
    ctx.fillStyle = P.trim; ctx.fillRect(-rx, -th + ry - 2, rx * 2, 3.5);
    ctx.beginPath(); ctx.ellipse(0, -th + 2.5, rx, ry, 0, 0, Math.PI); ctx.lineWidth = 2.5; ctx.strokeStyle = P.trim; ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.ellipse(0, -th, rx, ry, 0, 0, TAU); ctx.fillStyle = P.top; ctx.fill();
  // surface detail
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, -th, rx, ry, 0, 0, TAU); ctx.clip();
  ctx.strokeStyle = P.line; ctx.lineWidth = 1.5;
  if (lvl === 1) {
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 10, -th - ry); ctx.lineTo(i * 10, -th + ry); ctx.stroke(); }
  } else {
    ctx.beginPath(); ctx.ellipse(0, -th, rx * 0.62, ry * 0.62, 0, 0, TAU); ctx.stroke();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + 0.3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * rx * 0.62, -th + Math.sin(a) * ry * 0.62); ctx.lineTo(Math.cos(a) * rx, -th + Math.sin(a) * ry); ctx.stroke(); }
  }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(-rx * 0.3, -th - ry * 0.35, rx * 0.45, ry * 0.3, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
  sil(); ctx.lineWidth = 2.6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -th, rx, ry, 0, Math.PI, 0); ctx.lineWidth = 1.6; ctx.stroke();
  if (flag) {
    const fx = rx - 6, fy = -th - 2;
    ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 30); ctx.stroke();
    const wave = Math.sin(performance.now() / 260) * 2;
    const fl = () => { ctx.beginPath(); ctx.moveTo(fx, fy - 30); ctx.quadraticCurveTo(fx + 8, fy - 31 + wave, fx + 15, fy - 26 + wave); ctx.lineTo(fx, fy - 20); ctx.closePath(); };
    Art.cel(ctx, fl, flag, mix(flag, INK, 0.3), 0, -1.5, 2);
  }
};

function aimSide(angle) {
  const c = Math.cos(angle);
  const face = c < 0 ? -1 : 1;

// ---------------------------------------------------------------------------

  },
  draw(ctx, s, dx = 0, dy = 0) { ctx.drawImage(s.c, s.x0 + dx, s.y0 + dy, s.w, s.h); },
  glow(rgb) {

Art.stormCloud = function (ctx) {
  const cloud = () => { ctx.beginPath(); ctx.arc(-12, 2, 9, 0, TAU); ctx.arc(0, -4, 12, 0, TAU); ctx.arc(13, 1, 9, 0, TAU); ctx.rect(-12, 2, 25, 8); };
  cloud(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  Art.cel(ctx, cloud, '#8a94b0', '#5b6482', -2, -3, 0);
  Art.gloss(ctx, -4, -9, 6, 3, -0.3, 0.35);
};
Art.tower.thunder = function (ctx, tw, t, cache) {
  const lvl = tw.level, br = tw.branch;
  part(ctx, cache, `tb${lvl}${br}`, [-46, -80, 46, 22], (c) => Art.towerBase.thunder(c, lvl, br));
  const fa = tw.fireAnim || 0;
  const oy = -totemH(lvl, br) - 15;
  const pulse = 0.5 + 0.5 * Math.sin(t * 6);
  Art.glow(ctx, 0, oy, 28 + fa * 14, '255,236,120', 0.5 + 0.2 * pulse + fa * 0.3, cache);
  const hot = fa > 0.2;
  ctx.save(); ctx.translate(0, oy); ctx.scale(1 + fa * 0.45, 1 + fa * 0.45);
  part(ctx, cache, hot ? 'orbH' : 'orb', [-12, -12, 12, 12], (c) => Art.ball(c, 0, 0, 9, hot ? '#fffbe0' : '#ffe14d', '#f2b01e', 2.4, 0.7));
  ctx.restore();
  const R = 9 + fa * 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6;
  const rr = mulberry32(Math.floor(t * 12) + (tw.id || 0) * 7);
  for (let k = 0; k < 2; k++) {
    const a = rr() * TAU; let x = Math.cos(a) * R, y = oy + Math.sin(a) * R;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let j = 0; j < 3; j++) { x += Math.cos(a) * 5 + (rr() - 0.5) * 6; y += Math.sin(a) * 5 + (rr() - 0.5) * 6; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  if (br === 'B') {
    ctx.save(); ctx.translate(0, oy - 26 + Math.sin(t * 1.5) * 2);
    part(ctx, cache, 'cloud', [-26, -20, 26, 16], Art.stormCloud);
    ctx.restore();
  }
};

// ---- honey farm ---------------------------------------------------------------
Art.towerBase.farm = function (ctx, lvl) {
  Art.platform(ctx, lvl, null);
  if (lvl >= 2) {
    for (const [x, y, c] of [[-18, -6, '#ff8fb5'], [19, -4, '#fff'], [-10, 1, '#ffd84d'], [14, 2, '#ff8fb5']]) Art.flower(ctx, x, y, 3.4, c);
  }
  const gold = lvl >= 3;
  const hc = gold ? '#ffd84a' : '#f5bf45', hd = gold ? '#e09a1a' : '#c98a24';
  ctx.save(); ctx.translate(0, -8);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.fillStyle = '#a8693a';
  ctx.beginPath(); ctx.rect(-12, -4, 4, 6); ctx.rect(8, -4, 4, 6); ctx.fill(); ctx.stroke();
  const rings = [[16, -4], [17.5, -13], [16.5, -22], [13.5, -30], [9, -37]];
  for (const [rw, y] of rings) Art.cel(ctx, () => { ctx.beginPath(); ctx.ellipse(0, y - 4, rw, 6, 0, 0, TAU); }, hc, hd, -2, -2.5, 2.2);
  Art.ball(ctx, 0, -43, 5, hc, hd, 2.2, 0.5);
  ctx.fillStyle = '#5a3418'; ctx.beginPath(); ctx.ellipse(3, -8, 5, 4.4, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
  Art.cel(ctx, () => { ctx.beginPath(); ctx.moveTo(-9, -23); ctx.quadraticCurveTo(-7, -14, -6, -13); ctx.arc(-7, -13, 2.4, 0, Math.PI); ctx.quadraticCurveTo(-9, -16, -12, -23); ctx.closePath(); }, '#ff9f1c', '#d9750a', -0.5, -0.5, 1.6);
  Art.gloss(ctx, -8, -33, 4, 2, -0.4, 0.5);
  if (gold) {
    ctx.save(); ctx.translate(0, -48);
    Art.cel(ctx, () => { ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, -5); ctx.lineTo(0, -11); ctx.lineTo(3, -5); ctx.lineTo(8, -9); ctx.lineTo(7, 0); ctx.closePath(); }, '#ffd23f', '#e09a1a', -1, -1, 1.8);
    ctx.restore();
  }
  ctx.restore();
};
Art.tower.farm = function (ctx, tw, t, cache) {
  const lvl = tw.level;
  part(ctx, cache, `hb${lvl}`, [-46, -72, 46, 22], (c) => Art.towerBase.farm(c, lvl));
  const n = 1 + lvl;
  for (let i = 0; i < n; i++) {
    const a = t * (1.6 + i * 0.25) + i * 2.1;
    const bx = Math.cos(a) * (22 + i * 3), by = -30 + Math.sin(a * 1.3) * 12;
    const face = Math.sin(a) > 0 ? -1 : 1;
    if (cache) {
      const fb = Math.floor(t * 30 + i) % 3;
      ctx.save(); ctx.translate(bx, by); ctx.scale(face, 1);
      part(ctx, true, 'bee' + fb, [-7, -10, 7, 6], (c) => Art.bee(c, 0, 0, 1, fb === 0 ? 0 : fb === 1 ? 0.02 : 0.04));
      ctx.restore();
    } else Art.bee(ctx, bx, by, face, t);
  }
};

Art.bee = function (ctx, x, y, face, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  const flap = Math.abs(Math.sin(t * 40));
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.strokeStyle = INK; ctx.lineWidth = 1;
  Art.ellipse(ctx, -1, -4, 3, 2 + flap * 1.5, -0.4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd23f'; Art.ellipse(ctx, 0, 0, 4.2, 3.2); ctx.fill(); ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = INK; ctx.fillRect(-1.2, -3, 1.6, 6); ctx.beginPath(); ctx.arc(3, -0.6, 0.9, 0, TAU); ctx.fill();
  ctx.restore();
};

Art.flower = function (ctx, x, y, r, c) {
  ctx.fillStyle = c; ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
  for (let i = 0; i < 5; i++) {
    const a = i * TAU / 5;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 0.75, y + Math.sin(a) * r * 0.6, r * 0.55, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.arc(x, y, r * 0.42, 0, TAU); ctx.fill(); ctx.stroke();
};

Art.spore = function (ctx, x, y, r, rot, col = '#ec4b55', dark = '#b0303d') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  Art.ball(ctx, 0, 0, r, col, dark, 2, 0.5);
  ctx.fillStyle = '#fff6ea'; Art.ellipse(ctx, r * 0.3, -r * 0.2, r * 0.25, r * 0.22); ctx.fill(); Art.ellipse(ctx, -r * 0.35, r * 0.3, r * 0.2, r * 0.18); ctx.fill();
  ctx.restore();
};

Art.shard = function (ctx, x, y, ang, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
  g.addColorStop(0, 'rgba(190,245,255,0.8)'); g.addColorStop(1, 'rgba(190,245,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
  const sh = () => { ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(0, -4); ctx.lineTo(-8, 0); ctx.lineTo(0, 4); ctx.closePath(); };
  Art.cel(ctx, sh, '#d9f8ff', '#7fd4f5', -1, -1.2, 1.8);
  ctx.restore();
};

Art.homeBase = function (ctx, t) {
  Art.shadow(ctx, 0, 4, 46, 16, 0.25);
  // trunk house
  const trunk = () => { ctx.beginPath(); ctx.moveTo(-34, 0); ctx.quadraticCurveTo(-30, -26, -27, -52); ctx.lineTo(27, -52); ctx.quadraticCurveTo(30, -26, 34, 0); ctx.ellipse(0, 0, 34, 10, 0, 0, Math.PI); ctx.closePath(); };
  Art.cel(ctx, trunk, '#b5784a', '#83522d', -5, 0, 3);
  ctx.strokeStyle = rgba(INK, 0.35); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-22, -6); ctx.lineTo(-20, -40); ctx.moveTo(23, -4); ctx.lineTo(21, -38); ctx.stroke();
  // roots
  for (const s of [-1, 1]) Art.cel(ctx, () => { ctx.beginPath(); ctx.moveTo(s * 28, -10); ctx.quadraticCurveTo(s * 44, -2, s * 48, 6); ctx.quadraticCurveTo(s * 36, 4, s * 26, 2); ctx.closePath(); }, '#b5784a', '#83522d', -2, -1, 2.4);
  // door
  Art.cel(ctx, () => { ctx.beginPath(); ctx.moveTo(-10, 4); ctx.lineTo(-10, -18); ctx.arc(0, -18, 10, Math.PI, 0); ctx.lineTo(10, 4); ctx.closePath(); }, '#e0894a', '#a85a2a', -2, -1, 2.4);
  ctx.fillStyle = '#ffcc3d'; ctx.beginPath(); ctx.arc(5, -8, 1.8, 0, TAU); ctx.fill();
  // window
  const glow = 0.75 + 0.25 * Math.sin(t * 2);
  ctx.fillStyle = `rgba(255,214,90,${glow})`; ctx.beginPath(); ctx.arc(19, -32, 6, 0, TAU); ctx.fill(); ctx.lineWidth = 2.2; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13, -32); ctx.lineTo(25, -32); ctx.moveTo(19, -38); ctx.lineTo(19, -26); ctx.lineWidth = 1.5; ctx.stroke();
  // leafy roof
  const canopy = () => { ctx.beginPath(); ctx.arc(-26, -58, 18, 0, TAU); ctx.arc(26, -58, 18, 0, TAU); ctx.arc(-12, -72, 22, 0, TAU); ctx.arc(14, -72, 21, 0, TAU); ctx.arc(0, -56, 22, 0, TAU); };
  canopy(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  Art.cel(ctx, canopy, '#6cc657', '#3f9147', -5, -6, 0);
  Art.gloss(ctx, -18, -80, 9, 4.5, -0.4, 0.35);
};
Art.home = function (ctx, x, y, t, hit, cache) {
  ctx.save();
  const shake = hit > 0 ? Math.sin(t * 60) * hit * 4 : 0;
  ctx.translate(x + shake, y);
  part(ctx, cache, 'home', [-60, -100, 60, 22], (c) => Art.homeBase(c, 0.5));
  // sun seed
  const sy = -100 + Math.sin(t * 2) * 3;
  ctx.save(); ctx.translate(0, sy); ctx.rotate(t * 0.4);
  ctx.fillStyle = 'rgba(255,220,90,0.35)';
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 30, i * TAU / 8 - 0.13, i * TAU / 8 + 0.13); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  Art.glow(ctx, 0, sy, 28, '255,240,150', 0.9, cache);
  ctx.save(); ctx.translate(0, sy);
  part(ctx, cache, 'seed', [-14, -16, 14, 14], (c) => {
    Art.cel(c, () => { c.beginPath(); c.moveTo(0, -13); c.bezierCurveTo(11, -6, 11, 10, 0, 11); c.bezierCurveTo(-11, 10, -11, -6, 0, -13); }, '#ffd84a', '#f29a1e', -2, -2, 2.4);
    Art.gloss(c, -3.5, -3, 3, 2, -0.5, 0.75);
  });
  ctx.restore();
  ctx.restore();
};

Art.portal = function (ctx, x, y, t, cache) {
  ctx.save(); ctx.translate(x, y);
  ctx.save(); ctx.scale(1, 0.66); Art.glow(ctx, 0, 0, 62, '90,40,140', 0.6, cache); ctx.restore();
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const a = t * (1.5 + i * 0.4) + i * 2;
    ctx.strokeStyle = rgba(i === 1 ? '#c99bff' : '#7d4fc7', 0.75);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, 18 + i * 7, 10 + i * 4, 0, a, a + 2.2); ctx.stroke();
  }
  ctx.restore();
};

// ---------------------------------------------------------------------------
// Background generation and rendering
// ---------------------------------------------------------------------------
const THEMES = {
  meadow: {
    ground: '#8fd36c', dark: '#7cc35b', light: '#a7e185', tuft: '#5fae4a',
    path: '#f3d9a4', pathEdge: '#d6b277', pathDark: '#b98f57', pathLight: '#fbecc8',
    trees: [['#62c05a', '#3f9147'], ['#7fd05c', '#4fa142'], ['#56b46a', '#357f4c']],
    trunk: ['#a8693a', '#7a4826'], flowers: ['#ffffff', '#ffd84d', '#ff8fb5', '#b9a2ff'],
    rock: ['#c8c3bd', '#968f88'], bush: ['#4fae4a', '#357f37'], water: ['#6fd0ec', '#3fa6cf', '#bdf0fb'],
    ambient: 'butterfly',
  },
  autumn: {
    ground: '#c2cf68', dark: '#adbd56', light: '#d3de84', tuft: '#8a9a3a',
    path: '#efcf9f', pathEdge: '#cfa36c', pathDark: '#ad7f4c', pathLight: '#f9e4c2',
    trees: [['#f59a45', '#c96a24'], ['#ea5a4f', '#b33a3b'], ['#f7c948', '#d39a24']],
    trunk: ['#8f5a35', '#64391e'], flowers: ['#ffffff', '#ff9e5e', '#e9604f', '#ffd84d'],
    rock: ['#c9bfb1', '#958a7c'], bush: ['#d98a3a', '#a85f22'], water: ['#6fd0ec', '#3fa6cf', '#bdf0fb'],
    ambient: 'leaf',
  },
  snow: {
    ground: '#eaf3fa', dark: '#d8e7f3', light: '#ffffff', tuft: '#b7cfe2',
    path: '#dcc6a3', pathEdge: '#b8996f', pathDark: '#9a7a54', pathLight: '#efe3cc',
    trees: [['#3f9a82', '#2a6b5b'], ['#4aa98a', '#2f7a63']],
    trunk: ['#8f5a35', '#64391e'], flowers: ['#bfe9ff', '#ffffff'],
    rock: ['#a9b6c8', '#76839a'], bush: ['#4aa98a', '#2f7a63'], water: ['#9fe0f5', '#6cbfe0', '#e8fbff'],
    ambient: 'snow',
  },
};

// Build static decoration + placement blockers for a level (deterministic)
function buildScenery(level, paths) {
  const th = THEMES[level.theme];
  const rng = mulberry32(level.seed * 9973);
  const R = (a, b) => a + rng() * (b - a);
  const pathHalf = 26;
  const pd = (x, y) => Math.min(...paths.map((p) => p.distTo(x, y)));
  const deco = [];
  const blockers = [];
  const hx = level.home[0], hy = level.home[1];
  blockers.push({ x: hx, y: hy - 30, r: 52 });
  for (const [x, y, rx, ry] of level.pond) {
    deco.push({ k: 'pond', x, y, rx, ry });
    blockers.push({ x, y, r: Math.max(rx, ry) * 0.92, ell: [rx, ry] });
  }
  const free = (x, y, r) => {
    for (const b of blockers) if (dist(x, y, b.x, b.y) < b.r + r) return false;
    return true;
  };
  // trees: keep away from the road so there is a ring of build space
  let tries = 0, trees = 0;
  const target = level.theme === 'snow' ? 20 : 22;
  while (trees < target && tries++ < 1400) {
    const x = R(-10, W + 10), y = R(-10, H + 20);
    const r = R(20, 30);
    if (pd(x, y) < pathHalf + r + 70) continue;
    if (dist(x, y, hx, hy) < 110) continue;
    if (!free(x, y, r + 6)) continue;
    // prefer the edges of the map
    const edge = Math.min(x, W - x, y, H - y);
    if (edge > 140 && rng() < 0.75) continue;
    const kind = level.theme === 'snow' ? 'pine' : 'tree';
    deco.push({ k: kind, x, y, r, c: Math.floor(rng() * th.trees.length), s: rng() });
    blockers.push({ x, y: y - r * 0.4, r: r * 0.95 });
    trees++;
  }
  // rocks & bushes
  for (let i = 0, n = 0; i < 600 && n < 16; i++) {
    const x = R(20, W - 20), y = R(30, H - 10);
    const r = R(9, 17);
    if (pd(x, y) < pathHalf + r + 14) continue;
    if (!free(x, y, r + 4)) continue;
    const k = rng() < 0.45 ? 'rock' : (level.theme === 'autumn' && rng() < 0.5 ? 'shroom' : 'bush');
    deco.push({ k, x, y, r, s: rng() });
    blockers.push({ x, y, r: r * 0.9 });
    n++;
  }
  // non-blocking ground detail
  const ground = [];
  for (let i = 0; i < 260; i++) {
    const x = R(0, W), y = R(0, H);
    if (pd(x, y) < pathHalf + 8) continue;
    const roll = rng();
    if (roll < 0.55) ground.push({ k: 'tuft', x, y, s: R(0.7, 1.3) });
    else if (roll < 0.85) ground.push({ k: 'flower', x, y, c: Math.floor(rng() * th.flowers.length), s: R(0.8, 1.2) });
    else ground.push({ k: 'pebble', x, y, s: R(0.6, 1.2) });
  }
  const patches = [];
  for (let i = 0; i < 46; i++) patches.push({ x: R(-40, W + 40), y: R(-40, H + 40), r: R(40, 120), light: rng() < 0.5, sx: R(1.1, 1.9) });
  const pebbles = [];
  for (const p of paths) {
    for (let d = 0; d < p.length; d += 18) {
      if (rng() < 0.45) continue;
      const pt = p.at(d), len = Math.hypot(pt.dx, pt.dy) || 1;
      const off = R(-18, 18);
      pebbles.push({ x: pt.x - (pt.dy / len) * off, y: pt.y + (pt.dx / len) * off, s: R(1.2, 2.8), c: rng() });
    }
  }
  return { theme: th, deco, blockers, ground, patches, pebbles };
}

Art.tree = function (ctx, x, y, r, cols, trunk, s) {
  Art.shadow(ctx, x + 6, y + 4, r * 1.05, r * 0.42, 0.24);
  Art.cel(ctx, () => { ctx.beginPath(); ctx.moveTo(x - 6, y + 2); ctx.lineTo(x - 5, y - r * 0.9); ctx.lineTo(x + 5, y - r * 0.9); ctx.lineTo(x + 6, y + 2); ctx.closePath(); }, trunk[0], trunk[1], -2, 0, 2.4);
  const cy = y - r * 1.15;
  const blobs = [[0, 0, r], [-r * 0.6, r * 0.15, r * 0.7], [r * 0.62, r * 0.2, r * 0.66], [r * 0.05, -r * 0.55, r * 0.68]];
  const canopy = () => { ctx.beginPath(); for (const [bx, by, br] of blobs) { ctx.moveTo(x + bx + br, cy + by); ctx.arc(x + bx, cy + by, br, 0, TAU); } };
  canopy(); ctx.lineWidth = 5.5; ctx.strokeStyle = INK; ctx.stroke();
  Art.cel(ctx, canopy, cols[0], cols[1], -r * 0.22, -r * 0.24, 0);
  // inner leaf lines
  ctx.strokeStyle = rgba(cols[1], 0.9); ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x + r * 0.25, cy + r * 0.25, r * 0.4, 0.3, 1.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * 0.4, cy - r * 0.05, r * 0.3, 1.8, 2.8); ctx.stroke();
  Art.gloss(ctx, x - r * 0.35, cy - r * 0.6, r * 0.3, r * 0.16, -0.5, 0.3);
  if (s > 0.6) { ctx.fillStyle = '#ff5d6c'; for (const [ax, ay] of [[-0.3, 0.1], [0.35, -0.2], [0.1, 0.35]]) { ctx.beginPath(); ctx.arc(x + ax * r, cy + ay * r, 3, 0, TAU); ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke(); } }
};

Art.pine = function (ctx, x, y, r, cols, trunk) {
  Art.shadow(ctx, x + 6, y + 4, r * 0.95, r * 0.38, 0.22);
  Art.cel(ctx, () => { ctx.beginPath(); ctx.rect(x - 5, y - 14, 10, 16); }, trunk[0], trunk[1], -2, 0, 2.4);
  for (let i = 0; i < 3; i++) {
    const w = r * (1.05 - i * 0.22), by = y - 10 - i * r * 0.62, top = by - r * 0.95;
    const tri = () => { ctx.beginPath(); ctx.moveTo(x, top); ctx.quadraticCurveTo(x + w * 0.5, by - r * 0.3, x + w, by); ctx.quadraticCurveTo(x, by + 7, x - w, by); ctx.quadraticCurveTo(x - w * 0.5, by - r * 0.3, x, top); ctx.closePath(); };
    Art.cel(ctx, tri, cols[0], cols[1], -4, -2, 2.6);
    // snow cap
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(x, top + 1); ctx.quadraticCurveTo(x + w * 0.25, top + r * 0.3, x + w * 0.45, top + r * 0.42); ctx.quadraticCurveTo(x + w * 0.2, top + r * 0.32, x, top + r * 0.48); ctx.quadraticCurveTo(x - w * 0.2, top + r * 0.32, x - w * 0.45, top + r * 0.42); ctx.quadraticCurveTo(x - w * 0.25, top + r * 0.3, x, top + 1); ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke();
  }
};

Art.rock = function (ctx, x, y, r, cols) {
  Art.shadow(ctx, x + 3, y + 3, r * 1.1, r * 0.45, 0.22);
  const rk = () => { ctx.beginPath(); ctx.moveTo(x - r, y + 2); ctx.quadraticCurveTo(x - r * 1.05, y - r * 0.8, x - r * 0.2, y - r * 0.95); ctx.quadraticCurveTo(x + r * 0.9, y - r, x + r, y + 2); ctx.quadraticCurveTo(x, y + r * 0.35, x - r, y + 2); ctx.closePath(); };
  Art.cel(ctx, rk, cols[0], cols[1], -r * 0.2, -r * 0.2, 2.4);
  Art.gloss(ctx, x - r * 0.35, y - r * 0.6, r * 0.25, r * 0.12, -0.3, 0.4);
};

Art.bush = function (ctx, x, y, r, cols, berries) {
  Art.shadow(ctx, x + 3, y + 3, r * 1.2, r * 0.45, 0.2);
  const b = () => { ctx.beginPath(); ctx.arc(x - r * 0.55, y - r * 0.4, r * 0.62, 0, TAU); ctx.arc(x + r * 0.55, y - r * 0.38, r * 0.6, 0, TAU); ctx.arc(x, y - r * 0.72, r * 0.72, 0, TAU); ctx.rect(x - r * 1.0, y - r * 0.5, r * 2, r * 0.5); };
  b(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  Art.cel(ctx, b, cols[0], cols[1], -r * 0.2, -r * 0.25, 0);
  if (berries) { ctx.fillStyle = '#ff5d6c'; ctx.strokeStyle = INK; ctx.lineWidth = 1.2; for (const [bx, by] of [[-0.4, -0.5], [0.3, -0.8], [0.5, -0.35]]) { ctx.beginPath(); ctx.arc(x + bx * r, y + by * r, 2.4, 0, TAU); ctx.fill(); ctx.stroke(); } }
};

Art.bigShroom = function (ctx, x, y, r) {
  Art.shadow(ctx, x + 3, y + 3, r, r * 0.4, 0.2);
  Art.cel(ctx, () => { ctx.beginPath(); ctx.rect(x - r * 0.28, y - r * 0.9, r * 0.56, r * 0.92); }, '#fbecd2', '#dcc39c', -2, 0, 2.2);
  Art.cel(ctx, () => { ctx.beginPath(); ctx.ellipse(x, y - r * 0.9, r, r * 0.75, 0, Math.PI, 0); ctx.closePath(); }, '#e86a3a', '#b8461f', -2, -2, 2.4);
  ctx.fillStyle = '#fff6ea'; Art.ellipse(ctx, x - r * 0.4, y - r * 1.2, r * 0.18, r * 0.14); ctx.fill(); Art.ellipse(ctx, x + r * 0.3, y - r * 1.35, r * 0.13, r * 0.1); ctx.fill();
};

Art.pond = function (ctx, x, y, rx, ry, cols, t) {
  const pp = () => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); };
  ctx.save(); pp(); ctx.lineWidth = 10; ctx.strokeStyle = rgba('#ffffff', 0.35); ctx.stroke(); ctx.restore();
  Art.cel(ctx, pp, cols[0], cols[1], rx * 0.08, ry * 0.15, 3);
  ctx.save(); pp(); ctx.clip();
  ctx.strokeStyle = rgba(cols[2], 0.8); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - rx * 0.5 + i * 18, y - ry * 0.3 + i * 10); ctx.lineTo(x - rx * 0.5 + i * 18 + 16, y - ry * 0.3 + i * 10); ctx.stroke(); }
  ctx.restore();
  // lily pads
  for (const [lx, ly] of [[x + rx * 0.4, y + ry * 0.2], [x - rx * 0.35, y + ry * 0.35]]) {
    Art.cel(ctx, () => { ctx.beginPath(); ctx.moveTo(lx, ly); ctx.arc(lx, ly, 9, 0.4, TAU - 0.1); ctx.closePath(); }, '#7fd05c', '#4fa142', -1, -1, 2);
  }
  Art.flower(ctx, x + rx * 0.4 + 2, y + ry * 0.2 - 1, 3, '#ff8fb5');
};

Art.renderBackground = function (ctx, level, paths, sc) {
  const th = sc.theme;
  ctx.fillStyle = th.ground; ctx.fillRect(0, 0, W, H);
  for (const p of sc.patches) {
    ctx.fillStyle = p.light ? rgba(th.light, 0.55) : rgba(th.dark, 0.6);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * p.sx, p.r, 0, 0, TAU); ctx.fill();
  }
  // soft light from the top-left
  const lg = ctx.createLinearGradient(0, 0, W, H);
  lg.addColorStop(0, 'rgba(255,250,220,0.18)'); lg.addColorStop(1, 'rgba(60,40,90,0.08)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  // ground details
  for (const g of sc.ground) {
    if (g.k === 'tuft') {
      ctx.strokeStyle = th.tuft; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const s = g.s * 5;
      ctx.beginPath(); ctx.moveTo(g.x - s, g.y - s * 1.1); ctx.lineTo(g.x - s * 0.3, g.y); ctx.lineTo(g.x, g.y - s * 1.5); ctx.lineTo(g.x + s * 0.3, g.y); ctx.lineTo(g.x + s, g.y - s * 1.1); ctx.stroke();
    } else if (g.k === 'pebble') {
      ctx.fillStyle = rgba(th.rock[1], 0.6); Art.ellipse(ctx, g.x, g.y, 3 * g.s, 2 * g.s); ctx.fill();
    }
  }
  // road: all outlines first, then all fills so junctions merge cleanly
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const stroke = (w, col) => { for (const p of paths) { ctx.beginPath(); p.pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); } };
  ctx.save(); ctx.translate(0, 4); stroke(64, rgba(INK, 0.16)); ctx.restore();
  stroke(60, INK);
  stroke(55, th.pathDark);
  ctx.save(); ctx.translate(-1.5, -2.5); stroke(48, th.path); ctx.restore();
  ctx.save(); ctx.translate(-3, -4); stroke(22, rgba(th.pathLight, 0.55)); ctx.restore();
  for (const pb of sc.pebbles) {
    ctx.fillStyle = pb.c < 0.5 ? th.pathEdge : th.pathDark;
    Art.ellipse(ctx, pb.x, pb.y, pb.s * 1.3, pb.s); ctx.fill();
  }
  // flowers drawn after road so they never sit under it
  for (const g of sc.ground) if (g.k === 'flower') Art.flower(ctx, g.x, g.y, 3.2 * g.s, th.flowers[g.c]);
  // sorted scenery
  const ds = sc.deco.slice().sort((a, b) => a.y - b.y);
  for (const d of ds) {
    if (d.k === 'pond') Art.pond(ctx, d.x, d.y, d.rx, d.ry, th.water, 0);
  }
  for (const d of ds) {
    if (d.k === 'tree') Art.tree(ctx, d.x, d.y, d.r, th.trees[d.c], th.trunk, d.s);
    else if (d.k === 'pine') Art.pine(ctx, d.x, d.y, d.r, th.trees[d.c], th.trunk);
    else if (d.k === 'rock') Art.rock(ctx, d.x, d.y, d.r, th.rock);
    else if (d.k === 'bush') Art.bush(ctx, d.x, d.y, d.r, th.bush, d.s > 0.6 && level.theme !== 'snow');
    else if (d.k === 'shroom') Art.bigShroom(ctx, d.x, d.y, d.r * 1.1);
  }
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(40,20,60,0)'); vg.addColorStop(1, 'rgba(40,20,60,0.32)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
};

// tower icon to a small canvas (used by the shop UI)
Art.towerIcon = function (type, size = 84, level = 1, branch = null) {
  const c = document.createElement('canvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = c.height = size * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.translate(size / 2, size * 0.9);
  const s = size / 92;
  ctx.scale(s, s);
  Art.tower[type](ctx, { level, branch, angle: -0.3, x: 0, id: 1 }, 0.3, false);
  return c;
};

Art.enemyIcon = function (type, size = 64) {
  const c = document.createElement('canvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = c.height = size * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  const def = ENEMIES[type];
  const s = (size / 64) * Math.min(1.25, 22 / def.r);
  ctx.translate(size / 2, def.fly ? size * 0.55 : size * 0.86);
  ctx.scale(s, s);
  Art.enemy[type](ctx, enemyPal(type, 0), 0.6, 1, false);
  return c;
};
